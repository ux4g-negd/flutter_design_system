      <section>
        <h2>About UX4G Flutter</h2>
        <p>
          UX4G Flutter is the official open-source Flutter design system library crafted by the National e-Governance
          Division (NeGD),
          Ministry of Electronics and Information Technology (MeitY), Government of India. It empowers developers to
          build accessible,
          secure, and high-performance citizen-facing digital applications across Android, iOS, Web, and Desktop
          platforms.
        </p>
      </section>

      <section>
        <h2>Component Suite (48+ Native Flutter Widgets)</h2>
        <ul>
          <li><strong>Buttons & Action Controls:</strong> Ux4gButton, Ux4gIconButton, Ux4gLink, Ux4gTag, Ux4gBadge</li>
          <li><strong>Form Fields & Inputs:</strong> Ux4gInputField, Ux4gTextArea, Ux4gSearchField,
            Ux4gSelectionDropdown, Ux4gActionDropdown</li>
          <li><strong>Navigation & Structure:</strong> Ux4gAppHeader, Ux4gAccordion, Ux4gAccordionGroup, Ux4gCard,
            Ux4gDivider</li>
          <li><strong>Selection Controls:</strong> Ux4gCheckbox, Ux4gCheckboxGroup, Ux4gRadioButton, Ux4gRadioGroup,
            Ux4gSwitch, Ux4gToggle</li>
          <li><strong>Government-Exclusive Modules:</strong> Ux4gAadhaarInputField (Verhoeff checksum validation),
            Ux4gPanInputField, Ux4gOtpInput, Ux4gJourneyTimeline, Ux4gBiometricFaceAuth, Ux4gFeedbackFormStar,
            Ux4gFeedbackFormCsat, Ux4gEmptyState</li>
          <li><strong>Progress & Indicators:</strong> Ux4gLinearProgressBar, Ux4gCircularProgressIndicator,
            Ux4gHalfCircleProgress, Ux4gSpinner, Ux4gLoader</li>
          <li><strong>Pickers & Modals:</strong> Ux4gDatePicker, Ux4gTimePicker, Ux4gModal, Ux4gBottomSheet, Ux4gToast
          </li>
        </ul>
      </section>
